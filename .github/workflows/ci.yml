name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The toolchain comes from deps.yaml, so the version CI runs is the
      # version a developer runs — not whatever the runner image ships. craft
      # is a platform binary and is not installed here: nothing in the suite
      # opens a window.
      - name: Setup Pantry (provides bun, git)
        uses: pantry-pm/pantry/packages/action@main

      # `pantry env` prints the exports that put the installed toolchain on
      # PATH; without eval'ing it, later steps run against whatever the runner
      # image happens to have.
      - name: Install dependencies
        run: eval "$(pantry env | sed -n '/^export /,$p')" && bun install --frozen-lockfile

      - name: Build the client bundle
        run: eval "$(pantry env | sed -n '/^export /,$p')" && bun scripts/build-client.ts

      - name: Typecheck
        run: eval "$(pantry env | sed -n '/^export /,$p')" && bun tsc --noEmit -p tsconfig.json

      - name: Lint
        run: eval "$(pantry env | sed -n '/^export /,$p')" && bunx --bun pickier lint src scripts test

      - name: Test
        run: eval "$(pantry env | sed -n '/^export /,$p')" && bun test
